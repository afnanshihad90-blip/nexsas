services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/system/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BLOG_SIGNING_SECRET
        sync: false
      - key: BLOG_ENDPOINT
        sync: false
      - key: CLOUDFLARE_WEBHOOK_SECRET
        sync: false
      - key: PUBLISHING_MODE
        value: manual
      - key: AI_PROVIDER
        value: gemini
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
