services:
  - type: web
    name: nexus-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system/health
    envVars:
      - {key: APP_ENV, value: production}
      - {key: DATABASE_SSL, value: require}
      - {key: DATABASE_URL, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SECRET_KEY, sync: false}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_ORIGIN, sync: false}
      - {key: CORS_ALLOWED_ORIGINS, sync: false}
      - {key: CLOUDFLARE_WEBHOOK_SECRET, sync: false}
      - {key: BLOG_ENDPOINT, sync: false}
      - {key: BLOG_SIGNING_SECRET, sync: false}
      - {key: AI_PROVIDER, value: gemini}
      - {key: AI_PROVIDER_API_KEY, sync: false}
      - {key: PEXELS_API_KEY, sync: false}
      - {key: UNSPLASH_ACCESS_KEY, sync: false}
